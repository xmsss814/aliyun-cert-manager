services:
  cert-manager:
    image: aliyun-cert-manager:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建镜像时的 pip 源；国内/公司代理环境可用
        # PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple docker compose build 覆盖
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: aliyun-cert-manager
    restart: unless-stopped
    # 守护进程模式由镜像内默认参数保证；这里只覆盖间隔
    environment:
      # —— 阿里云凭证（必填，建议从 .env 注入）——
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      # —— 证书配置 ——
      CERT_DOMAIN: ${CERT_DOMAIN}
      CERT_TYPE: ${CERT_TYPE:-free-dv}
      CERT_DIR: /data/certs
      ALIBABA_DNS_DOMAIN: ${ALIBABA_DNS_DOMAIN:-${CERT_DOMAIN}}
      RENEWAL_DAYS: ${RENEWAL_DAYS:-30}
      # —— 守护进程 ——
      INTERVAL_HOURS: ${INTERVAL_HOURS:-12}
      # —— 部署 ——
      NO_RELOAD: ${NO_RELOAD:-1}
      RELOAD_CMD: ${RELOAD_CMD:-}
      # —— 邮件通知（QQ 邮箱，可选；NOTIFY_ENABLED=1 时生效）——
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-0}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      NOTIFY_ON_NOOP: ${NOTIFY_ON_NOOP:-0}
    volumes:
      # 证书持久化到宿主机
      - ./certs:/data/certs
      # 时区（容器内日志时间与宿主机一致）
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
